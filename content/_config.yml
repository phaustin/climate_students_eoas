# Book settings
######################################################################################
# Book settings
title: "Climate Laboratory Book"
author: Brian Rose
email: paustin@eoas.ubc.ca
description: >- # this means to ignore newlines until "baseurl:"
  Climate Laboratory

execute:
  execute_notebooks: off
parse:
  myst_enable_extensions:  # default extensions to enable in the myst parser. See https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - amsmath
    - colon_fence
    - dollarmath
    - html_admonition
    - html_image
    
only_build_toc_files: true

exclude_patterns: ["*.pixi*","*ipynb*",".jupyter_cache/*",_build, Thumbs.db, .DS_Store, "*.ipynb_checkpoints"]

execute:
  execute_notebooks: cache
  cache: .jupyter_cache
  allow_errors: true
  timeout: 120
  exclude_patterns:
    - "*.jupyter_cache*"
    - "*ipynb*"
    - "lab25_3_advanced-snowball-earth.md"
    - "lab25_albedo-snowball.md"
    

parse:
  myst_enable_extensions:  # default extensions to enable in the myst parser. See https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - amsmath
    - colon_fence
    - dollarmath
    - html_admonition
    - html_image

repository:
  url: https://github.com/phaustin/ClimateLaboratoryBook
  branch: jb
  path_to_book: content

launch_buttons:
  notebook_interface: "classic" # The interface interactive links will activate ["classic", "jupyterlab"]


html:
  home_page_in_navbar: true
  baseurl: https://phaustin.github.io/climate_students_eoas

